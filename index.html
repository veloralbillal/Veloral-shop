<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloral Digital & Shop</title>
    <meta name="description" content="Digital products, physical goods, mobile & game top-up, and AliExpress on-demand shopping platform." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.json" />
    <meta property="og:title" content="Veloral Digital & Shop" />
    <meta property="og:description" content="Digital products, physical goods, mobile & game top-up, and AliExpress on-demand shopping platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#020617] text-slate-100 min-h-screen antialiased">
    <div id="root">
      <div style="min-height: 100vh; background: #020617; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
        <div style="max-width: 320px;">
          <div id="loading-spinner" style="width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #2563eb; border-radius: 50%; margin: 0 auto 24px; animation: spin 1s linear infinite;"></div>
          <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          <div style="width: 60px; height: 60px; background: #2563eb; border-radius: 18px; margin: 0 auto 24px; display: none; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; box-shadow: 0 10px 25px rgba(37,99,235,0.4);" id="app-logo">V</div>
          <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.025em;">Veloral Digital & Shop</h2>
          <p id="fallback-msg" style="font-size: 13px; color: #94a3b8; margin-bottom: 28px; line-height: 1.6;">স্টোর লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
          <div id="recovery-actions" style="display: none;">
            <p id="error-status" style="font-size: 11px; color: #f43f5e; margin-bottom: 20px; font-weight: bold; background: rgba(244,63,94,0.1); padding: 8px; border-radius: 8px;">অ্যাপ লোড হতে ব্যর্থ হয়েছে (Asset Path Issue)</p>
            <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 12px 24px; background: #e11d48; border: none; border-radius: 14px; color: white; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(225,29,72,0.3); width: 100%;">রিসেট ও রিলোড (Fix Stuck App)</button>
          </div>
        </div>
      </div>
      <script>
        // Detection for GitHub Pages subfolder issue
        if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/')) {
           // Ensure trailing slash for relative paths to work correctly
           // window.location.replace(window.location.href + '/');
        }

        // If React doesn't take over in 6 seconds, show recovery actions
        setTimeout(function() {
          if (document.getElementById('loading-spinner')) {
            document.getElementById('loading-spinner').style.display = 'none';
            document.getElementById('app-logo').style.display = 'flex';
            document.getElementById('fallback-msg').innerText = 'লোডিং হচ্ছে না? ব্যাকআপ থেকে শুরু করতে নিচের বাটনে চাপুন।';
            document.getElementById('recovery-actions').style.display = 'block';
          }
        }, 6000);

        window.onerror = function(msg, url, line) {
          console.error("Critical Error:", msg, "at", url, ":", line);
          const status = document.getElementById('error-status');
          if (status) status.innerText = "Error: " + msg.substring(0, 50);
          return false;
        };
      </script>
    </div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
