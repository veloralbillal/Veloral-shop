<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Veloral Redirecting...</title>
    <script type="text/javascript">
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var pathname = l.pathname;
        
        var segments = pathname.split('/').filter(Boolean);
        var subpath = segments.length >= pathSegmentsToKeep ? '/' + segments.slice(pathSegmentsToKeep).join('/') : '/';

        var search = l.search ? '&' + l.search.slice(1) : '';
        var repoPath = segments.length >= 1 ? '/' + segments[0] : '';
        
        var redirectUrl = l.protocol + '//' + l.host + repoPath + '/?p=' + encodeURIComponent(subpath) + search + l.hash;
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
