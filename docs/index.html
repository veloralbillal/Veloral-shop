<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veloral Digital & Shop</title>
    <meta name="description" content="Digital products, physical goods, mobile & game top-up, and AliExpress on-demand shopping platform." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.json" />
    <meta property="og:title" content="Veloral Digital & Shop" />
    <meta property="og:description" content="Digital products, physical goods, mobile & game top-up, and AliExpress on-demand shopping platform." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="module" crossorigin src="./assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body class="bg-[#020617] text-slate-100 min-h-screen antialiased">
    <div id="root">
      <div style="min-height: 100vh; background: #020617; display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; text-align: center; padding: 20px;">
        <div style="max-width: 320px;">
          <div id="loading-spinner" style="width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: #2563eb; border-radius: 50%; margin: 0 auto 24px; animation: spin 1s linear infinite;"></div>
          <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
          <div style="width: 60px; height: 60px; background: #2563eb; border-radius: 18px; margin: 0 auto 24px; display: none; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; box-shadow: 0 10px 25px rgba(37,99,235,0.4);" id="app-logo">V</div>
          <h2 style="font-size: 20px; font-weight: 900; margin-bottom: 12px; letter-spacing: -0.025em;">Veloral Digital & Shop</h2>
          <p id="fallback-msg" style="font-size: 13px; color: #94a3b8; margin-bottom: 28px; line-height: 1.6;">স্টোর লোড হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
          <div id="recovery-actions" style="display: none;">
            <p id="error-status" style="font-size: 11px; color: #f43f5e; margin-bottom: 10px; font-weight: bold; background: rgba(244,63,94,0.1); padding: 8px; border-radius: 8px;">অ্যাপ লোড হতে ব্যর্থ হয়েছে (Asset Path Issue)</p>
            <div id="debug-info" style="font-size: 10px; color: #64748b; margin-bottom: 20px; font-family: monospace; word-break: break-all; background: #0f172a; padding: 10px; border-radius: 8px; text-align: left;"></div>
            <button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 12px 24px; background: #e11d48; border: none; border-radius: 14px; color: white; font-weight: 800; font-size: 13px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(225,29,72,0.3); width: 100%;">রিসেট ও রিলোড (Fix Stuck App)</button>
          </div>
        </div>
      </div>
      <script>
        (function() {
          const debug = document.getElementById('debug-info');
          const updateDebug = (msg) => { if(debug) debug.innerHTML += '<div>' + msg + '</div>'; };
          
          updateDebug('URL: ' + window.location.href);
          updateDebug('Path: ' + window.location.pathname);

          // If React doesn't take over in 10 seconds, show recovery actions
          const timer = setTimeout(function() {
            if (document.getElementById('loading-spinner')) {
              document.getElementById('loading-spinner').style.display = 'none';
              document.getElementById('app-logo').style.display = 'flex';
              document.getElementById('fallback-msg').innerText = 'লোডিং হচ্ছে না? রিসেট করে পুনরায় চেষ্টা করুন।';
              document.getElementById('recovery-actions').style.display = 'block';
              updateDebug('Status: Load Timeout');
            }
          }, 10000);

          window.onerror = function(msg, url, line) {
            const status = document.getElementById('error-status');
            if (status) status.innerText = "Error: " + msg.substring(0, 40);
            updateDebug('Err: ' + msg);
            updateDebug('Src: ' + (url ? url.split('/').pop() : 'unknown'));
            return false;
          };

          function getDynamicBasePath() {
            const path = window.location.pathname;
            const segments = path.split('/');
            if (segments.length > 1) {
              if (segments[segments.length - 1].indexOf('.') !== -1 || segments[segments.length - 1] === '') {
                segments.pop();
              }
              const base = segments.join('/');
              return base + (base.endsWith('/') ? '' : '/');
            }
            return '/';
          }

          window.handleScriptError = function(script) {
            updateDebug('Failed to load: ' + script.src);
            
            if (script.src.indexOf('src/main.tsx') !== -1) {
              const basePath = getDynamicBasePath();
              const jsUrl = basePath + 'assets/index.js';
              const cssUrl = basePath + 'assets/index.css';
              
              updateDebug('Base Path: ' + basePath);
              updateDebug('Checking production fallbacks...');
              
              // Try loading CSS
              fetch(cssUrl)
                .then(r => {
                  if (r.ok) {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = cssUrl;
                    document.head.appendChild(link);
                    updateDebug('CSS fallback found & injected');
                  }
                }).catch(() => {});
              
              // Try loading JS
              fetch(jsUrl)
                .then(r => {
                  if (r.ok) {
                    updateDebug('JS fallback found, injecting...');
                    const fallbackScript = document.createElement('script');
                    fallbackScript.type = 'module';
                    fallbackScript.src = jsUrl;
                    fallbackScript.onload = function() {
                      updateDebug('Fallback script loaded');
                    };
                    fallbackScript.onerror = function() {
                      updateDebug('Fallback script execution error');
                      showFinalError();
                    };
                    document.body.appendChild(fallbackScript);
                  } else {
                    updateDebug('JS fallback 404/Error: ' + r.status);
                    showFinalError();
                  }
                })
                .catch(err => {
                  updateDebug('Fetch check failed: ' + err.message);
                  showFinalError();
                });
            } else {
              showFinalError();
            }
          };

          function showFinalError() {
            const status = document.getElementById('error-status');
            if (status) status.innerText = "ফাইল লোড ব্যর্থ (Network/Path Issue)";
            document.getElementById('recovery-actions').style.display = 'block';
            document.getElementById('loading-spinner').style.display = 'none';
          }

          // Mark as loaded when React starts
          window.markAppAsLoaded = function() {
            clearTimeout(timer);
            updateDebug('Status: Success');
          };
        })();
      </script>
    </div>
  </body>
</html>
